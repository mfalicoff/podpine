name: Mobile CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  quality:
    name: Format, analyze, test, and Drift
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Run unit and widget tests
        run: flutter test --coverage
      - name: Verify Drift generation is current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run drift_dev schema dump \
            lib/core/database/app_database.dart drift_schemas/
          git diff --exit-code -- \
            lib/core/database/app_database.g.dart drift_schemas/

  android-release:
    name: Android release build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure persistent Android signing
        env:
          PODPINE_ANDROID_KEYSTORE_BASE64: ${{ secrets.PODPINE_ANDROID_KEYSTORE_BASE64 }}
          PODPINE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PODPINE_ANDROID_KEYSTORE_PASSWORD }}
          PODPINE_ANDROID_KEY_ALIAS: ${{ secrets.PODPINE_ANDROID_KEY_ALIAS }}
          PODPINE_ANDROID_KEY_PASSWORD: ${{ secrets.PODPINE_ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for variable in \
            PODPINE_ANDROID_KEYSTORE_BASE64 \
            PODPINE_ANDROID_KEYSTORE_PASSWORD \
            PODPINE_ANDROID_KEY_ALIAS \
            PODPINE_ANDROID_KEY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::The $variable repository secret is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          keystore_path="${{ runner.temp }}/podpine-release.p12"
          umask 077
          printf '%s' "$PODPINE_ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$keystore_path"
          keytool -list \
            -keystore "$keystore_path" \
            -storepass "$PODPINE_ANDROID_KEYSTORE_PASSWORD" \
            -alias "$PODPINE_ANDROID_KEY_ALIAS" > /dev/null
      - name: Build signed release app bundle and APK
        env:
          PODPINE_SENTRY_DSN: ${{ secrets.PODPINE_SENTRY_DSN }}
          PODPINE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/podpine-release.p12
          PODPINE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PODPINE_ANDROID_KEYSTORE_PASSWORD }}
          PODPINE_ANDROID_KEY_ALIAS: ${{ secrets.PODPINE_ANDROID_KEY_ALIAS }}
          PODPINE_ANDROID_KEY_PASSWORD: ${{ secrets.PODPINE_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$PODPINE_SENTRY_DSN" ]; then
            echo "::error::The PODPINE_SENTRY_DSN repository secret is not configured."
            exit 1
          fi
          flutter build appbundle --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=PODPINE_SENTRY_DSN="$PODPINE_SENTRY_DSN" \
            --dart-define=PODPINE_ENVIRONMENT=production
          flutter build apk --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=PODPINE_SENTRY_DSN="$PODPINE_SENTRY_DSN" \
            --dart-define=PODPINE_ENVIRONMENT=production
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-release-signed
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-release-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  ios-release:
    name: iOS release build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release app without signing
        env:
          PODPINE_SENTRY_DSN: ${{ secrets.PODPINE_SENTRY_DSN }}
        run: |
          if [ -z "$PODPINE_SENTRY_DSN" ]; then
            echo "::error::The PODPINE_SENTRY_DSN repository secret is not configured."
            exit 1
          fi
          flutter build ios --release --no-codesign \
            --build-number="${{ github.run_number }}" \
            --dart-define=PODPINE_SENTRY_DSN="$PODPINE_SENTRY_DSN" \
            --dart-define=PODPINE_ENVIRONMENT=production
